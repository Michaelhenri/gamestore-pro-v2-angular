<mat-toolbar class="header-toolbar">
  <div class="logo-container" routerLink="/">
    <img src="assets/logo.png" alt="Logo GameStore Pro" class="logo-img">
    <span class="logo-text">GAMESTORE <span class="logo-highlight">PRO</span></span>
  </div>

  <span class="spacer"></span>

  <button mat-icon-button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
    <mat-icon>{{ menuAberto ? 'close' : 'menu' }}</mat-icon>
  </button>

  <nav class="nav-links" [class.active]="menuAberto">
    <a mat-button routerLink="/" (click)="fecharMenu()">HOME</a>
    <a mat-button href="#section-vendidos" (click)="fecharMenu()">PRODUTOS</a>
    <a mat-button routerLink="/login" (click)="fecharMenu()">LOGIN</a>
    
    <a mat-raised-button color="accent" href="#carrinho" class="cart-btn" (click)="fecharMenu()">
      <mat-icon>shopping_cart</mat-icon>
      <span>Carrinho (0)</span>
    </a>
  </nav>
</mat-toolbar>
