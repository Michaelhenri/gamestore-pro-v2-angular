<app-banner></app-banner>

<div class="catalog-wrapper">
  <!-- Seção de Periféricos -->
  <section class="catalog-section" id="section-vendidos">
    <h2 class="section-title">Os Mais <span class="highlight">Vendidos</span></h2>

    <div class="games-grid">
      <mat-card *ngFor="let item of perifericos" class="game-card">
        <mat-card-header>
          <mat-card-title>{{ item.titulo }}</mat-card-title>
          <mat-card-subtitle>{{ item.categoria }}</mat-card-subtitle>
        </mat-card-header>

        <img mat-card-image [src]="item.imagem" [alt]="item.titulo" class="card-image">
        
        <mat-card-content>
          <p class="game-description">{{ item.descricao }}</p>
          <p class="game-price">{{ item.preco | currency:'BRL':'symbol':'1.2-2' }}</p>
        </mat-card-content>

        <mat-card-actions align="end">
          <button mat-raised-button color="accent" (click)="adicionarAoCarrinho(item)">
            <mat-icon>shopping_cart</mat-icon> Comprar
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </section>

  <!-- Seção de Jogos -->
  <section class="catalog-section">
    <h2 class="section-title">Destaques do <span class="highlight">Catálogo</span></h2>

    <div class="games-grid">
      <mat-card *ngFor="let jogo of jogos" class="game-card">
        <mat-card-header>
          <mat-card-title>{{ jogo.titulo }}</mat-card-title>
          <mat-card-subtitle>{{ jogo.categoria }}</mat-card-subtitle>
        </mat-card-header>

        <img mat-card-image [src]="jogo.imagem" [alt]="jogo.titulo" class="card-image">
        
        <mat-card-content>
          <p class="game-description">{{ jogo.descricao }}</p>
          <p class="game-price">{{ jogo.preco | currency:'BRL':'symbol':'1.2-2' }}</p>
        </mat-card-content>

        <mat-card-actions align="end">
          <button mat-raised-button color="accent" (click)="adicionarAoCarrinho(jogo)">
            <mat-icon>shopping_cart</mat-icon> Comprar
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </section>
</div>
