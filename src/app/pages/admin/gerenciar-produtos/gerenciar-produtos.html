<div class="admin-container">
  <div class="admin-header">
    <h2>Painel Administrativo - Gestão de Produtos</h2>
    <button mat-raised-button color="primary" (click)="abrirFormularioNovo()">
      <mat-icon>add</mat-icon> Novo Produto
    </button>
  </div>

  <mat-card class="table-card">
    <table mat-table [dataSource]="produtos" class="mat-elevation-z2">

      <!-- Coluna ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{ element.id }} </td>
      </ng-container>

      <!-- Coluna Título -->
      <ng-container matColumnDef="titulo">
        <th mat-header-cell *matHeaderCellDef> Título </th>
        <td mat-cell *matCellDef="let element"> {{ element.titulo }} </td>
      </ng-container>

      <!-- Coluna Categoria -->
      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef> Categoria </th>
        <td mat-cell *matCellDef="let element"> {{ element.categoria }} </td>
      </ng-container>

      <!-- Coluna Preço -->
      <ng-container matColumnDef="preco">
        <th mat-header-cell *matHeaderCellDef> Preço </th>
        <td mat-cell *matCellDef="let element"> {{ element.preco | currency:'BRL':'symbol':'1.2-2' }} </td>
      </ng-container>

      <!-- Coluna Ações (Editar e Excluir) -->
      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef class="text-center"> Ações </th>
        <td mat-cell *matCellDef="let element" class="text-center">
          <button mat-icon-button color="accent" (click)="editarProduto(element)" title="Editar">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="excluirProduto(element.id)" title="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="colunasTabela"></tr>
      <tr mat-row *matRowDef="let row; columns: colunasTabela;"></tr>
    </table>
  </mat-card>
</div>
